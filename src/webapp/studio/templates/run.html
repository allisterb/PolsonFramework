<!doctype html>
<meta charset="utf-8">
<title>{{ run.id }} — Polson Studio</title>
<link rel="stylesheet" href="/static/studio.css">

<main class="run" data-run="{{ run.id }}">
  <header>
    <a class="back" href="/">← projects</a>
    <h1>{{ run.project }}</h1>
    <span class="status {{ run.status }}" id="status">{{ run.status }}</span>
    <span class="hint">{{ run.workflow }} · started {{ run.started }}</span>
  </header>

  {% if run.error %}<p class="refused">{{ run.error }}</p>{% endif %}

  <div class="panes">
    <section class="trace">
      <h2>What is happening <span class="hint" id="count">0 events</span></h2>
      <ol id="events"></ol>
    </section>

    <aside class="latest">
      <h2>Latest render</h2>
      <figure id="render">
        <p class="empty">Nothing rendered yet.</p>
      </figure>
    </aside>
  </div>
</main>

<script>
// Deliberately plain: no framework, no build step. The record is already the model — every event
// carries what a reader needs, so the page appends rather than reconciles.
(function () {
  const runId = document.querySelector('main').dataset.run;
  const list = document.getElementById('events');
  const count = document.getElementById('count');
  const status = document.getElementById('status');
  const render = document.getElementById('render');

  // Rows a reader cares about. Anything else still arrives and is still shown, just unstyled —
  // a new event type should appear as soon as the engine emits it, not once this file knows it.
  const LABEL = {
    'run.start': 'run started', 'run.end': 'run ended',
    'stage.begin': 'stage', 'stage.end': 'stage ended', 'stage.continue': 'stage continues',
    'note': 'note', 'script.start': 'executing', 'script.ok': 'executed', 'script.error': 'failed',
    'render': 'rendered', 'inspect': 'looked', 'artifact.read': 'read back',
    'thinking': 'thinking', 'text': 'said', 'tool.call': 'tool',
    'question.open': 'asking', 'question.closed': 'answered', 'message': 'director'
  };

  let n = 0;
  const source = new EventSource(`/runs/${runId}/events`);

  source.onmessage = () => {};   // typed events only; this keeps the default handler quiet

  for (const kind of Object.keys(LABEL).concat(['stream.lag', 'stream.truncated', 'run.closed'])) {
    source.addEventListener(kind, (e) => show(kind, JSON.parse(e.data)));
  }

  function show(kind, event) {
    if (kind === 'run.closed') {
      status.textContent = event.status;
      status.className = 'status ' + event.status;
      source.close();
      return;
    }

    n += 1;
    count.textContent = n + (n === 1 ? ' event' : ' events');

    const li = document.createElement('li');
    li.className = 'ev ' + kind.replace('.', '-');
    li.innerHTML =
      `<span class="kind">${LABEL[kind] || kind}</span>` +
      (event.stage ? `<span class="stage">${esc(event.stage)}</span>` : '') +
      `<span class="detail">${esc(detail(kind, event))}</span>`;
    list.appendChild(li);
    li.scrollIntoView({ block: 'nearest' });

    // Artifacts arrive as paths and are fetched by URL, never embedded in the stream — which is
    // what lets a refresh rebuild this page from the record alone.
    if (kind === 'render' && event.artifact) {
      render.innerHTML =
        `<img src="/runs/${runId}/${event.artifact}?v=${n}" alt="${esc(event.artifact)}">` +
        `<figcaption>${esc(event.artifact)}</figcaption>`;
    }
  }

  function detail(kind, e) {
    if (kind === 'note' || kind === 'message') return e.message || e.text || '';
    if (kind === 'render') return e.artifact || '';
    if (kind === 'inspect') return Object.entries(e.probes || {}).map(([k, v]) => `${k} ${v}`).join(', ');
    if (kind === 'artifact.read') return e.artifact || '';
    if (kind === 'tool.call') return e.tool || '';
    if (kind === 'script.error') return e.error || e.script || '';
    if (kind === 'stage.begin' || kind === 'stage.end') return e.stage || '';
    if (kind === 'question.open') return e.text || '';
    return (e.text || e.script || e.message || '').toString();
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, (c) =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  }
})();
</script>
