# pip configuration for this virtual environment.
#
# pip reads this automatically whenever the venv is active, so these apply without anyone having to
# remember a flag. Windows venvs use pip.ini; the POSIX equivalent is pip.conf.

[global]

# One index, named explicitly. The dependency-confusion attack needs two sources that pip may
# resolve across, so the control is to never add `extra-index-url`. A private feed, if one is ever
# needed, belongs behind its own explicitly-scoped install rather than mixed into the default graph.
index-url = https://pypi.org/simple

# Wheels only. A source distribution executes its setup.py during installation, which is arbitrary
# code execution at install time on this machine, before anything has been reviewed or run. Refusing
# sdists removes that step entirely: a package that ships no wheel fails loudly instead of building.
only-binary = :all:

# Never install into the system interpreter by accident.
require-virtualenv = true

# Fail rather than hang if the index is slow or unreachable.
timeout = 15
retries = 2

# Deliberately NOT set here: require-hashes.
#
# It belongs on the install command, not in the config, because a config-level require-hashes also
# applies to bootstrapping the tool that generates the hashes (pip-tools or uv), which cannot itself
# be hash-pinned until it has run once. Keeping it on the command line makes the guarantee explicit
# at the point it matters, and keeps the bootstrap honest rather than quietly exempt.
# See python/README.md for the install procedure.
